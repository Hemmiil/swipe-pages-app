name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # スプレッドシート送信先URL。リポジトリの Variables に VITE_GAS_URL を登録する。
          # 未設定でもビルドは成功し、その場合はクラウド送信が無効になる。
          VITE_GAS_URL: ${{ vars.VITE_GAS_URL }}
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Pagesが未有効でもワークフロー側で自動有効化し、再デプロイを自己完結させる
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
